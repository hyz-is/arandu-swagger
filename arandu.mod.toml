# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls. A package that says it makes no outbound
# calls and then holds an HTTP client is rejected, which is what makes the
# four lines below worth reading before installing anything.

name = "hyz-is/arandu-swagger"
framework = ">= 0.56"
profiles = ["conventional", "performance"]

[permissions]
# It answers requests from embedded bytes. Nothing leaves the process.
network = false
# The openapi:export console command writes and reads the contract files under
# Config.ContractDir. Serving requests reads no file: Swagger UI assets are
# embedded at build time.
filesystem = true
# It runs no other program.
exec = false
# Documentation is derived from the route table and owns no database schema.
migrations = false
